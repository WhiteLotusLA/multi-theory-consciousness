[oscillatory.salience_alpha]
type = "float"
default = 0.3
min = 0.0
max = 1.0
description = "Mixing coefficient for salience-driven oscillator input"

[oscillatory.sync_threshold]
type = "float"
default = 0.7
min = 0.0
max = 1.0
description = "Phase coherence threshold above which oscillators are considered bound"

[oscillatory.history_window]
type = "int"
default = 100
min = 10
max = 1000
description = "Number of past binding states retained for temporal analysis"

# -----------------------------------------------------------------------------
# RPT: RPTMeasurement
# -----------------------------------------------------------------------------

[rpt.local_recurrence_threshold]
type = "float"
default = 0.3
min = 0.0
max = 1.0
description = "Minimum recurrence strength for local (within-module) processing"

[rpt.global_recurrence_threshold]
type = "float"
default = 0.4
min = 0.0
max = 1.0
description = "Minimum recurrence strength for global (cross-module) processing"

[rpt.history_window]
type = "int"
default = 50
min = 5
max = 500
description = "Number of past recurrence measurements retained for analysis"

[assessment.saturated_baseline_min_range]
type = "float"
default = 0.1
min = 0.0
max = 0.5
description = "Minimum headroom (1.0 minus the noise baseline) an indicator must leave before its normalized score counts; below it the indicator scores 0.0 as uninformative (v0.4.0: 0.0, no guard)"

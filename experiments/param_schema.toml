min = 0.0001
max = 0.5
description = "Rate at which attention budget depletes over time"

[fep.drives.attention_budget.recovery_rate]
type = "float"
default = 0.05
min = 0.001
max = 1.0
description = "Rate at which attention budget recovers toward optimal level"

[fep.drives.attention_budget.importance]
type = "float"
default = 1.0
min = 0.0
max = 5.0
description = "Relative weight of attention budget in drive arbitration"


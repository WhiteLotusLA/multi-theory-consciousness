[fep.hierarchy_observation]
type = "str"
default = "content"
choices = ["content", "hpp_top_level"]
description = "Observation the workspace gives the discrete agent: the content-derived input (content), or the v0.4.0 route through the encoded top-level hierarchy beliefs (hpp_top_level)"

[fep.meta_accuracy_method]
type = "str"
default = "ledger"
choices = ["ledger", "median"]
description = "How the meta-state judges a prediction accurate: scored forecast ledger, or the v0.4.0 running-median verdict"

[fep.drive_model]
type = "str"
default = "f4"
choices = ["f4", "v04"]
description = "Homeostatic drive activity vocabulary (f4 matches the activity names callers send; v04 is the v0.4.0 vocabulary)"

[fep.drive_decay_floor]
type = "float"
default = 0.1
min = 0.0
max = 0.5
description = "Natural drive decay stops at this fraction of each drive's optimal level"

[fep.legacy_double_decay]
type = "bool"

# -----------------------------------------------------------------------------
# BLT: BeautifulLoop
# -----------------------------------------------------------------------------

[blt.num_levels]
type = "int"
default = 3
min = 2
max = 10
description = "Number of hierarchical levels in the Beautiful Loop (at least 2: precision balance is undefined for a single level)"

[blt.precision_learning_rate]
type = "float"
default = 0.1
min = 0.0001
max = 1.0
description = "Learning rate for precision-weight updates in Bayesian binding"

[blt.min_binding_quality]
type = "float"
default = 0.2
min = 0.0
max = 1.0
description = "Minimum binding quality threshold for cross-level integration"

[blt.max_epistemic_depth]
type = "int"
default = 5
min = 1
max = 20
description = "Maximum depth of epistemic recursion (meta-levels of self-modeling)"

[blt.field_evidencing_threshold]
type = "float"
default = 0.3
min = 0.0
max = 1.0
description = "Threshold for field-evidencing to contribute to consciousness detection"

[blt.loop_quality_formula]
type = "str"
default = "recursive"
choices = ["recursive", "v04"]
description = "Loop quality formula (recursive adds recursive confidence and a momentum boost; v04 is the v0.4.0 weighting and requires blt.binding_evidence = v04_salience_posterior, the binding quality it reads)"

[blt.precision_floor_enabled]
type = "bool"
default = true
description = "Uniformly high precision across levels earns a 0.4 precision-balance floor (v0.4.0 scored it near zero)"

[blt.require_recursive_confidence]
type = "bool"
default = true
description = "Field evidencing also needs the hyper-model recursive confidence above 0.3"

[blt.binding_evidence]
type = "str"
default = "candidate_vectors"
choices = ["candidate_vectors", "v04_salience_posterior"]
description = "candidate_vectors binds only winners that carry their own numeric vector and reports no quality otherwise; v04_salience_posterior builds belief vectors from salience and a shared posterior (v0.4.0), which binds at about 1 for any input"

[blt.strange_loop_test]
type = "str"
default = "independent_calibration"
choices = ["independent_calibration", "v04_confidence_match"]
description = "independent_calibration compares the self-model's scored self-prediction accuracy with the inference ledger's forecast accuracy; v04_confidence_match compares the self-model's confidence with the value it was copied from (v0.4.0)"

# -----------------------------------------------------------------------------
# Damasio: DamasioLayers
# -----------------------------------------------------------------------------

[damasio.stability_window]
type = "int"
default = 20
min = 5
max = 200
description = "Number of recent ticks used to compute emotional stability"

[damasio.circadian]
type = "str"
default = "sinusoid"
choices = ["sinusoid", "v04_sawtooth", "wall_clock"]
description = "Protoself circadian model (smooth sinusoid, the v0.4.0 sawtooth, or the wall clock in the configured timezone)"

[damasio.first_delta]
type = "str"
default = "unmeasured"
choices = ["unmeasured", "v04_zero"]
description = "unmeasured reports no body delta, stability or arousal on the first update, which has no previous body state; v04_zero records 0.0, 1.0 and 0.0 (v0.4.0)"

# -----------------------------------------------------------------------------
# IIT: PhiTracker
# -----------------------------------------------------------------------------

[phi.scale]
type = "float"
default = 1.0
min = 0.1
max = 10.0
description = "Multiplier on the PhiTracker integration proxy (raw bits at 1.0)"

[phi.warmup_reference]
type = "float"
default = 5.0
min = 0.1
max = 50.0
description = "Denominator for the PhiTracker's normalized readout before enough values are recorded for a percentile (a display calibration, not a measurement)"

# -----------------------------------------------------------------------------
# Runner: experiment and assessment warmup
# -----------------------------------------------------------------------------

[runner.warmup_profile]
type = "str"
default = "v05"
choices = ["v05", "v04"]
description = "Warmup attention feed: v05 alternates voluntary and captured shifts with goal-driven ones so typed provenance has chosen shifts to count; v04 feeds captured shifts only"

[runner.assess_blt_source]
type = "str"
default = "workspace"
choices = ["workspace", "standalone"]
description = "Which beautiful loop the assessment CLI's standalone path hands the assessment: the workspace's own loop, which the warmup drives (workspace), or the separate loop nothing drives (standalone, the behaviour before v0.5.0)"


[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-theory-consciousness"
version = "0.5.0.dev0"
description = "A research framework implementing eight theories of consciousness as interacting computational modules"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Calvin Devereaux", email = "calvin.devereaux+mtc@gmail.com" },
]
keywords = [
    "consciousness",
    "neuroscience",
    "global-workspace-theory",
    "attention-schema",
    "higher-order-thought",
    "free-energy-principle",
    "integrated-information",
    "active-inference",
    "spiking-neural-networks",
    "computational-neuroscience",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
neural = [
    "snntorch>=0.7",
    "torch>=2.0",
    "reservoirpy>=0.4",
]
fep = [
    "inferactively-pymdp>=0.0.7",
]
databases = [
    "redis>=5.0",
    "motor>=3.0",
    "pymongo>=4.0",
    "neo4j>=5.0",
    "qdrant-client>=1.7",
    "asyncpg>=0.29",
    "sqlalchemy>=2.0",
]
assessment = [
    "pymc>=5.0",
    "anthropic>=0.50",
    "requests>=2.28",
]
embeddings = [
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "flake8>=6.0",
    "pytest-timeout>=2.3",
]
# iit: exact IIT 4.0 Phi via PyPhi. PyPhi is licensed GPLv3+ and is never
# vendored or imported unless the user installs this extra themselves.
iit = [
    "pyphi @ git+https://github.com/wmayner/pyphi.git@46ca11273f676b0c91eb79860f34f4ee63dc7a6e ; python_version >= '3.12'",
]
all = [
    "multi-theory-consciousness[neural,fep,databases,assessment,embeddings,dev]",
]

[project.urls]
Repository = "https://github.com/WhiteLotusLA/multi-theory-consciousness"
Documentation = "https://github.com/WhiteLotusLA/multi-theory-consciousness/tree/main/docs"

# Note: CLI entry point removed -- run assessment via:
#   python scripts/run_assessment.py --full --report

[tool.setuptools.packages.find]
include = ["mtc*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
timeout = 900
markers = [
    "slow: wall-clock heavy or subprocess tests; deselect with -m 'not slow'",
    "db: needs a running database; skipped when the store is absent",
    "live: talks to a running stack; never run by default",
    "gpu: needs MPS or CUDA",
    "benchmark: performance measurement, not correctness",
    "security: security-relevant behaviour",
]


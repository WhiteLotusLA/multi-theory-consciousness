[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-theory-consciousness"
version = "0.5.0"
description = "A research framework implementing eight theories of consciousness as interacting computational modules"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Calvin Devereaux", email = "calvin.devereaux+mtc@gmail.com" },
]
keywords = [
    "consciousness",
    "neuroscience",
    "global-workspace-theory",
    "attention-schema",
    "higher-order-thought",
    "free-energy-principle",
    "integrated-information",
    "active-inference",
    "spiking-neural-networks",
    "computational-neuroscience",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# neural: the spiking, reservoir and liquid-state substrates and the resource
# guard's process statistics.
neural = [
    "snntorch>=0.7",
    "torch>=2.0",
    "reservoirpy>=0.4",
    "psutil>=5.9",
]
# fep: active inference through pymdp (its NumPy agent: pymdp.legacy from 1.0,
# pymdp.agent before). The workspace builds active inference unconditionally,
# so mtc assess, mtc serve and the demos need this extra (mtc doctor reports
# its absence as a required failure, and a command that builds a workspace
# without it stops with one MISSING EXTRA line and exit code 2). pymdp 0.0.7
# pulls in matplotlib, pandas, seaborn, pytest and a documentation theme. It
# stays an extra rather than a core dependency because promoting an extra to
# a core dependency later is not a breaking change and the reverse is.
fep = [
    "inferactively-pymdp>=0.0.7",
]
# iit: exact IIT 4.0 Phi via PyPhi. PyPhi is licensed GPLv3 or later; it is
# never vendored, it is imported lazily through mtc.consciousness.pyphi_bridge
# only when installed, and it is never part of "all". Installing it creates a
# GPLv3 combination on that machine (see THIRD_PARTY_LICENSES.md).
iit = [
    "pyphi @ git+https://github.com/wmayner/pyphi.git@46ca11273f676b0c91eb79860f34f4ee63dc7a6e ; python_version >= '3.12'",
]
# embeddings: the sentence embedder for vector recall and the model download
# behind mtc doctor --fetch-models.
embeddings = [
    "sentence-transformers>=2.2",
    "huggingface_hub>=0.20",
]
postgres = [
    "asyncpg>=0.29",
]
mongo = [
    "pymongo>=4.0",
]
redis = [
    "redis>=5.0",
]
neo4j = [
    "neo4j>=5.0",
]
qdrant = [
    "qdrant-client>=1.7",
]
databases = [
    "multi-theory-consciousness[postgres,mongo,redis,neo4j,qdrant]",
]
# llm: the local chat-completions provider's HTTP client.
llm = [
    "httpx>=0.27",
]
# anthropic: the optional Anthropic provider (sends prompts to an external API).
anthropic = [
    "anthropic>=0.50",
]
# api: the HTTP and websocket server (mtc.api); the HTTP client is the one the
# framework's test client needs.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
# research: the DCM benchmark's Bayesian inference (pymc) and its scheme fetch;
# mtc.research itself needs only the core dependencies.
research = [
    "pymc>=5.0",
    "requests>=2.28",
]
# assessment: an alias of research plus the Anthropic provider the DCM
# evaluator's claude mode uses.
assessment = [
    "multi-theory-consciousness[research,anthropic]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.3",
    "black>=23.0",
    "flake8>=6.0",
    "packaging>=23.0",
]
# all: every extra except iit (GPLv3 or later, opt-in only).
all = [
    "multi-theory-consciousness[neural,fep,embeddings,postgres,mongo,redis,neo4j,qdrant,databases,llm,anthropic,api,research,assessment,dev]",
]

[project.scripts]
mtc = "mtc.cli.main:main"

[project.urls]
Repository = "https://github.com/WhiteLotusLA/multi-theory-consciousness"
Documentation = "https://github.com/WhiteLotusLA/multi-theory-consciousness/tree/main/docs"
Changelog = "https://github.com/WhiteLotusLA/multi-theory-consciousness/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["mtc*"]

# Shipped defaults (generated copies, see scripts/sync_resources.py) and the
# onboarding templates travel with the package, so an installed mtc works from
# any directory.
[tool.setuptools.package-data]
"mtc.resources" = [
    "**/*.yaml",
    "**/*.yml",
    "**/*.json",
    "**/*.toml",
    "**/*.md",
    "**/*.txt",
]
"mtc.onboarding" = [
    "templates/**/*.yaml",
    "templates/**/*.md",
    "templates/**/*.txt",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
timeout = 900
markers = [
    "slow: wall-clock heavy or subprocess tests; deselect with -m 'not slow'",
    "db: needs a running database; skipped when the store is absent",
    "live: talks to a running stack; never run by default",
    "gpu: needs MPS or CUDA",
    "benchmark: performance measurement, not correctness",
    "security: security-relevant behaviour",
]


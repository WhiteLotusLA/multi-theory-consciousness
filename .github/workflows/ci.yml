name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  # Nightly or by hand: only the published-numbers job runs on these.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-audit:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be tested in an `if:` directly, so expose the private
      # list through an env var. It is never interpolated into a script.
      DENYLIST_SECRET: ${{ secrets.PRIVACY_DENYLIST_EXTRA }}
      # Pull requests from forks receive no secrets; every other run must
      # have the private list or the job fails closed.
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the private denylist from the repository secret
        run: |
          if [ -n "$DENYLIST_SECRET" ]; then
            umask 077
            printf '%s\n' "$DENYLIST_SECRET" > "$RUNNER_TEMP/denylist.local.txt"
            echo "PRIVACY_DENYLIST_EXTRA=$RUNNER_TEMP/denylist.local.txt" >> "$GITHUB_ENV"
          elif [ "$FORK_PR" = "true" ]; then
            echo "::warning::No private denylist on a fork pull request; the public checks still run."
          else
            echo "::error::Repository secret PRIVACY_DENYLIST_EXTRA is not set; refusing to audit without it."
            exit 1
          fi
      - name: Audit the tracked tree
        run: python scripts/privacy_audit.py
      - name: Audit added lines in this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/privacy_audit.py --patch-from "origin/$BASE_REF"

  env-sync:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Generated artifacts: each has a generator with a --check mode, and
      # none is edited by hand.
      - run: python scripts/gen_env_example.py --check
      - run: python scripts/gen_schemas.py --check
      - run: PYPHI_WELCOME_OFF=yes python -m mtc.db.migrations --check
      - run: python scripts/sync_resources.py --check

  lint:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black flake8
      - run: black --check --line-length 88 mtc tests scripts examples
      - run: flake8 mtc tests scripts examples
      - name: Shell scripts parse and pass shellcheck
        run: |
          for script in $(git ls-files 'scripts/*.sh'); do bash -n "$script" || exit 1; done
          shellcheck $(git ls-files 'scripts/*.sh')

  tests:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[neural,fep,llm,anthropic,api,databases,dev]"
      # Hermetic: no store, model server or back end is contacted.
      - run: PYPHI_WELCOME_OFF=yes python -m pytest tests -q -m "not slow and not db and not live" --timeout=900

  # A stranger's path: a non-editable install with every extra, a project set
  # up from the example answers, the examples and the quick assessment with
  # the mock provider and in-memory stores, then an audit of what was written.
  install-smoke:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MTC_DEVICE: cpu
      PYPHI_WELCOME_OFF: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package (not editable) with every extra
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[all]"
      - name: The installed copy is the one in use
        run: |
          cd "$RUNNER_TEMP"
          python -c "import mtc, sys; print(mtc.__version__); sys.exit(0 if 'site-packages' in mtc.__file__ else 1)"
      - name: Set up a project from the example answers
        run: |
          mkdir -p "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          mtc --version
          mtc init --print-example-answers > answers.yaml
          mtc init --from answers.yaml --yes --no-probe
          mtc doctor --json
      - name: Run the examples
        run: |
          cd "$RUNNER_TEMP/proj"
          python "$GITHUB_WORKSPACE/examples/full_pipeline_demo.py" --state-dir runtime/demo
          python "$GITHUB_WORKSPACE/examples/continuous_thought.py" --state-dir runtime/ctm
          python "$GITHUB_WORKSPACE/examples/basic_assessment.py"
          python "$GITHUB_WORKSPACE/examples/multi_theory_pipeline.py"
          python "$GITHUB_WORKSPACE/examples/neural_substrates.py"
          python "$GITHUB_WORKSPACE/examples/single_theory.py"
      - name: Run the quick assessment
        run: |
          cd "$RUNNER_TEMP/proj"
          mtc assess --quick --json --json-path results/smoke.json
      - name: Audit the runtime logs and results
        run: |
          cd "$RUNNER_TEMP/proj"
          python "$GITHUB_WORKSPACE/scripts/privacy_audit.py" --runtime runtime results

  # Every installed distribution has a licence the table allows. The iit
  # extra (PyPhi, GPL version 3 or later) is installed and audited on its own.
  license-audit:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[all]"
      - run: python scripts/license_audit.py --extras all
      - run: pip install ".[iit]"
      - run: python scripts/license_audit.py --extras iit

  # The published numbers. The tests that hold them (the legacy preset, both
  # v0.5.0 fixtures, seeded reproducibility, the exact Phi path and the DCM
  # benchmark) are slow or need extras the tests job does not install, so the
  # tests job never runs them. This job does, on the platform and with the
  # versions recorded in tests/fixtures/baseline_v050_env.txt (arm64 macOS, the
  # recorded interpreter, numpy, scipy, torch and the two substrate packages
  # pinned to the recorded versions, PyPhi through the iit extra's commit pin).
  # It runs on pull requests to main, nightly and by hand (the maintainer can
  # start it on the release candidate), not on every push.
  published-numbers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MTC_DEVICE: cpu
      PYPHI_WELCOME_OFF: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Pin the versions recorded with the fixtures
        run: |
          for package in numpy scipy torch snntorch reservoirpy; do
            awk -v name="$package" '$1 == name { print name "==" $2 }' tests/fixtures/baseline_v050_env.txt
          done > "$RUNNER_TEMP/pins.txt"
          cat "$RUNNER_TEMP/pins.txt"
          test "$(wc -l < "$RUNNER_TEMP/pins.txt")" -eq 5
      - run: pip install -c "$RUNNER_TEMP/pins.txt" -e ".[neural,fep,research,iit,dev]"
      - run: python -m pytest tests/test_legacy_preset.py tests/test_v050_baseline.py tests/test_run_assessment.py tests/test_run_experiment.py tests/assessment/test_phi_exact_path.py tests/assessment/test_dcm_benchmark.py -q -m "not db and not gpu" --timeout=900
